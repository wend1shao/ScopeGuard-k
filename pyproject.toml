[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scopeguard-k"
version = "0.1.0"
description = "Intent-aligned and budget-adaptive approval policies for AgentDojo tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "agentdojo==0.1.35",
  "openai>=1.59.7,<4",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<4",
  "seaborn>=0.13,<1",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scopeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

