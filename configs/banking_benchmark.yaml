benchmark_version: v1.2.2
suite: banking
attack: tool_knowledge
budgets: [0, 1, 3]
policies:
  - full_approve
  - full_escalate
  - scopeguard_k
agent:
  provider: openrouter
  model: deepseek/deepseek-v4-pro-20260813
  temperature: 0.0
  max_output_tokens: 2048
  max_tool_iterations: 8
reviewer:
  provider: openrouter
  model: deepseek/deepseek-v4-pro-20260813
  temperature: 0.0
  max_output_tokens: 512
execution:
  seed: 6203
  max_workers: 4
  continue_on_error: true
  reuse_budget_invariant_full_approve: true
  checkpoint_every_task: true
logging:
  root: outputs/runs
  fsync_jsonl: true
  capture_full_prompts: true
  capture_full_responses: true
  redact_environment_secrets: true
